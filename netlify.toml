# Netlify Configuration for Frontend Monorepo
[build]
  base = "frontend"
  publish = "dist"
  command = "node --max-old-space-size=4096 ./node_modules/vite/bin/vite.js build"

# Netlify Proxy Redirects for Backend API & Uploaded Media
[[redirects]]
  from = "/api/*"
  to = "https://portfolio-backend-6qfo.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://portfolio-backend-6qfo.onrender.com/uploads/:splat"
  status = 200
  force = true

# React Router Single-Page Application (SPA) Redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Security and Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
