# Netlify Configuration for Single-Page Application
[build]
  command = "npm run build"
  publish = "dist"

# Netlify Proxy Redirects for Backend API & Uploaded Media
[[redirects]]
  from = "/api/*"
  to = "https://portfolio-backend-6qfo.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://portfolio-backend-6qfo.onrender.com/uploads/:splat"
  status = 200
  force = true

# Redirect all requests to index.html for React Router SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
