    <!-- Instant Tab Branding Bootstrap from local cache (prevents flashing default names) -->
    <script>
      (function() {
        try {
          var cached = localStorage.getItem('portfolio_cached_data');
          if (cached) {
            var parsed = JSON.parse(cached);
            if (parsed && parsed.profile && parsed.profile.fullName) {
              var n = parsed.profile.fullName.trim();
              var r = (parsed.profile.title || '').trim();
              if (n) {
                document.title = r ? (n + ' | ' + r) : (n + ' | Portfolio');
              }
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
