  <line x1="25" y1="265" x2="335" y2="265" stroke="#334155" stroke-width="1" />
  <text x="38" y="285" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">HTTP/1.1 200 OK [MUTATION_COMMITTED]</text>
