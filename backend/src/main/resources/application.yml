server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: portfolio-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${DB_USERNAME:root}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_PASSWORD:password}}}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:c3VwZXJfc2VjcmV0X2p3dF9rZXlfYXtfbGVhc3RfMzJfY2hhcmFjdGVyc19sb25nXzIwMjY=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

